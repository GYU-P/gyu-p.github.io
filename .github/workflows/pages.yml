name: Publish site to GitHub Pages

# 新曲追加はMuseで手動。定期処理は掲載済み動画の再生数だけを更新する。
on:
  workflow_dispatch:
    inputs:
      refresh_views:
        description: '再生数を取得してから公開する（YouTube APIキーが必要）'
        type: boolean
        default: false
  schedule:
    # 日本時間6:17ごろ。GitHub側の混雑などで遅れる場合があります。
    - cron: '17 21 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh existing video view counts only
        if: github.event_name == 'schedule' || inputs.refresh_views
        run: pnpm run update:views
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: node --test tests/work-credits.test.mjs tests/works-review.test.mjs tests/view-counts.test.mjs
      - run: pnpm run check
      - run: pnpm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Save updated counts without overwriting newer work
        if: github.event_name == 'schedule' || inputs.refresh_views
        shell: bash
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$GITHUB_REF_NAME")" ]; then
            echo 'Repository changed during this run; stop rather than publish stale data.'
            exit 1
          fi
          if ! git diff --quiet -- src/data/works.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/data/works.json
            git commit -m 'Update YouTube view counts'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
